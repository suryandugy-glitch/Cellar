name: Deadlock Sentinel Java
on:
  push:
    paths:
      - 'products/deadlock-sentinel/**'
      - '.github/workflows/deadlock-sentinel.yml'
  pull_request:
    paths:
      - 'products/deadlock-sentinel/**'
      - '.github/workflows/deadlock-sentinel.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and test
        working-directory: products/deadlock-sentinel
        run: |
          javac -d out src/main/java/com/cellar/deadlock/DeadlockSentinel.java src/test/java/com/cellar/deadlock/DeadlockSentinelTest.java
          java -cp out com.cellar.deadlock.DeadlockSentinelTest
      - name: Check detection exit code
        working-directory: products/deadlock-sentinel
        run: |
          set +e
          java -cp out com.cellar.deadlock.DeadlockSentinel samples/deadlock.txt
          status=$?
          set -e
          test "$status" -eq 1
