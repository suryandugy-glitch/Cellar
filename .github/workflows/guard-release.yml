name: Publish Cellar Guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/guard-release.yml'
      - 'scripts/package-guard.sh'
      - 'release/**'
      - 'docs/GUARD_START_HERE.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cellar-guard-public-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run Java tests
        run: java Build.java test
      - name: Package and verify user download
        run: bash scripts/package-guard.sh
      - name: Publish a dedicated Cellar Guard release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(java -jar dist/cellar.jar --version)"
          version="${version#Cellar Guard }"
          tag="guard-v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$tag" \
            "dist/Cellar-Guard-${version}.zip" dist/SHA256SUMS.txt \
            --title "Cellar Guard ${version} — Java 21+ download" \
            --notes-file docs/GUARD_RELEASE_NOTES.md \
            --target "$GITHUB_SHA" \
            --latest
