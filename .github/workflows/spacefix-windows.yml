name: SpaceFix Windows installer
on:
  push:
    branches: [main]
    paths: ['products/spacefix/*.java', 'products/spacefix/portable.nsi', '.github/workflows/spacefix-windows.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: spacefix-windows-release
jobs:
  package:
    runs-on: windows-2022
    env:
      VERSION: '1.1.0'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and test the desktop app
        shell: pwsh
        run: |
          mkdir classes,tests,fixture,input,images,installer
          javac --release 21 -encoding UTF-8 -d classes products/spacefix/SpaceFix.java products/spacefix/SmartScanner.java products/spacefix/SpaceFixWindow.java
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          javac --release 21 -cp classes -d tests products/spacefix/SpaceFixTest.java
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          java -cp 'classes;tests' SpaceFixTest fixture $env:LOCALAPPDATA
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          jar --create --file input/SpaceFix.jar --main-class SpaceFix -C classes .
      - name: Bundle the runtime and smoke-test the native launcher
        shell: pwsh
        run: |
          jpackage --type app-image --name SpaceFix --app-version $env:VERSION --vendor "Cellar Studio" --input input --main-jar SpaceFix.jar --add-modules java.desktop --dest images
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $app = Start-Process images/SpaceFix/SpaceFix.exe -ArgumentList '--smoke-test' -PassThru
          if (!$app.WaitForExit(60000)) { $app.Kill(); throw 'Launcher timed out' }
          if ($app.ExitCode -ne 0) { throw "Launcher failed with exit code $($app.ExitCode)" }
      - name: Build the per-user Windows installer
        shell: pwsh
        run: |
          if ($env:WIX) { $env:Path = "$env:WIX\bin;$env:Path" }
          jpackage --type exe --app-image images/SpaceFix --name SpaceFix --app-version $env:VERSION --vendor "Cellar Studio" --win-per-user-install --win-menu --win-menu-group "Cellar Studio" --win-shortcut --dest installer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Move-Item "installer/SpaceFix-$env:VERSION.exe" installer/SpaceFix-Setup.exe
          $setup = Start-Process installer/SpaceFix-Setup.exe -ArgumentList '/quiet','/norestart' -PassThru
          if (!$setup.WaitForExit(120000) -or $setup.ExitCode -ne 0) { throw "Installer failed" }
          $installed = Join-Path $env:LOCALAPPDATA 'SpaceFix/SpaceFix.exe'
          $check = Start-Process $installed -ArgumentList '--smoke-test' -PassThru
          if (!$check.WaitForExit(60000) -or $check.ExitCode -ne 0) { throw "Installed app failed" }
      - name: Build and run the single-file Windows download
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $compiler)) { choco install nsis -y --no-progress }
          & $compiler /NOCD products/spacefix/portable.nsi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $check = Start-Process installer/SpaceFix.exe -ArgumentList '--smoke-test' -PassThru
          if (!$check.WaitForExit(90000) -or $check.ExitCode -ne 0) { throw "Portable app failed" }
          Get-FileHash installer/SpaceFix.exe
      - name: Package the portable Java edition
        shell: pwsh
        run: |
          Copy-Item products/spacefix/Start-SpaceFix.cmd installer/Start-SpaceFix.cmd
          Copy-Item products/spacefix/README.md installer/README.md
          Compress-Archive -Path input/SpaceFix.jar,installer/Start-SpaceFix.cmd,installer/README.md -DestinationPath installer/SpaceFix.zip -CompressionLevel Optimal
      - name: Publish the verified build
        shell: pwsh
        run: |
          $tag = "spacefix-v$env:VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag installer/SpaceFix.exe installer/SpaceFix-Setup.exe installer/SpaceFix.zip --clobber
          } else {
            gh release create $tag installer/SpaceFix.exe installer/SpaceFix-Setup.exe installer/SpaceFix.zip --target $env:GITHUB_SHA --title "SpaceFix $env:VERSION for Windows x64" --notes "Offline smart storage review, verified duplicate checks, and a new neo-brutalist interface. Windows executables bundle Java; originals are never removed without a separate confirmation." --latest=false
          }
