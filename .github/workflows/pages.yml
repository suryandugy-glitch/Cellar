name: Website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: sh deploy/build-pages.sh
      - name: Check the Vercel build against the Java-generated site
        run: |
          node deploy/build-vercel.mjs
          grep -q 'Cellar Studio' build/pages/index.html
          grep -q 'CSV compatibility checks' build/pages/guard.html
          grep -q 'Cellar Studio' build/vercel/index.html
          grep -q 'CSV compatibility checks' build/vercel/guard.html
          diff -r --exclude='*.html' build/pages build/vercel
          for page in demo.html guide.html walkthrough.html workplace.html; do
            sed '/<meta http-equiv="Content-Security-Policy"/d' "build/vercel/$page" | diff "build/pages/$page" -
          done
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: build/pages

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
