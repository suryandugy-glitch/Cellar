<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 426" role="img" aria-labelledby="title desc">
  <title id="title">Cellar Studio — find the failure before release</title>
  <desc id="desc">A bold, black-and-cream neo-brutalist banner with an amber headline panel and a release-gate card blocking a breaking CSV export.</desc>
  <rect x="34" y="34" width="1138" height="366" fill="#111111"/>
  <rect x="16" y="16" width="1138" height="366" fill="#F6F4EE" stroke="#111111" stroke-width="8"/>
  <rect x="16" y="16" width="1138" height="57" fill="#111111"/>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="800" letter-spacing="2">
    <text x="42" y="53" fill="#F6F4EE" font-size="23">CELLAR STUDIO / ENGINEERING</text>
    <text x="1127" y="53" text-anchor="end" fill="#FFD659" font-size="18">RELEASE SYSTEMS</text>
  </g>
  <path d="M778 75V379" stroke="#111111" stroke-width="6"/>
  <path d="M803 90L820 90M803 104L820 104M803 118L820 118M803 132L820 132M803 146L820 146" stroke="#111111" stroke-width="5"/>
  <g font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" letter-spacing="-5">
    <text x="52" y="169" fill="#111111" font-size="93">FIND THE</text>
    <rect x="46" y="186" width="679" height="98" fill="#FFD659" stroke="#111111" stroke-width="6"/>
    <text x="56" y="267" fill="#111111" font-size="98">FAILURE.</text>
    <text x="51" y="336" fill="#111111" font-size="46" letter-spacing="-2">BEFORE RELEASE.</text>
  </g>
  <text x="52" y="365" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="2" font-size="16" fill="#373737">JAVA 21  /  LOCAL-FIRST  /  EVIDENCE FIRST</text>
  <rect x="849" y="118" width="244" height="220" fill="#111111"/>
  <rect x="829" y="98" width="244" height="220" fill="#FFFFFF" stroke="#111111" stroke-width="6"/>
  <rect x="829" y="98" width="244" height="44" fill="#111111"/>
  <text x="847" y="127" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" letter-spacing="1.5" fill="#FFFFFF">RELEASE GATE</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700" fill="#111111">
    <text x="850" y="169">INPUT   orders.csv</text>
    <text x="850" y="199">CHECK   contract</text>
  </g>
  <path d="M846 213H1055" stroke="#111111" stroke-width="3"/>
  <rect x="847" y="227" width="207" height="54" fill="#F0806B" stroke="#111111" stroke-width="5"/>
  <text x="950" y="265" font-family="Arial Black, Arial, sans-serif" font-size="32" font-weight="900" text-anchor="middle" fill="#111111" letter-spacing="1">BLOCK</text>
  <text x="950" y="305" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#111111">EXIT CODE 1 / EVIDENCE</text>
  <path d="M1110 97L1135 97M1122 85V109" stroke="#111111" stroke-width="5"/>
</svg>
