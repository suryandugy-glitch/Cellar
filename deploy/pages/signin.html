<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in or create a Cellar Studio account.">
  <title>Sign in | Cellar Studio</title>
  <link rel="icon" href="./logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./account.css">
  <script type="module" src="./account.js"></script>
</head>
<body class="account-page" data-account-page="signin">
  <header class="account-header">
    <a class="account-brand" href="./studio.html"><span class="account-mark"><img src="./logo.svg" alt="" width="23" height="23"></span>Cellar<span>Studio</span></a>
    <a class="account-top-link" href="./studio.html">Explore the studio</a>
  </header>
  <main class="account-main">
    <section class="account-intro" aria-labelledby="intro-title">
      <div class="account-motif" aria-hidden="true"><i></i><i></i><i></i><b></b></div>
      <h1 id="intro-title">Your Cellar<br><em>Studio account.</em></h1>
      <p>Sign in with your email, Google, or Microsoft account.</p>
    </section>
    <section class="account-card" aria-labelledby="account-title">
      <div class="account-tabs" role="group" aria-label="Account action">
        <button type="button" data-account-mode="signin" aria-pressed="true">Sign in</button>
        <button type="button" data-account-mode="signup" aria-pressed="false">Create an account</button>
      </div>
      <h2 id="account-title">Welcome back</h2>
      <p class="account-hint" id="account-hint">Enter your email and password to continue.</p>
      <form id="auth-form" method="post" autocomplete="on">
        <fieldset id="account-fields" disabled>
          <div id="name-field" hidden><label for="account-name">Name</label><input id="account-name" name="name" autocomplete="name" maxlength="100" placeholder="Your full name"></div>
          <div><label for="account-email">Email address</label><input id="account-email" name="email" type="email" autocomplete="username" maxlength="254" placeholder="you@example.com" required></div>
          <div><label for="account-password">Password</label><input id="account-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required></div>
          <label class="account-check" id="remember-field"><input id="account-remember" type="checkbox"> Keep me signed in on this device</label>
          <button class="account-primary" id="account-submit" type="submit">Sign in <span aria-hidden="true">→</span></button>
        </fieldset>
      </form>
      <p class="account-status" id="account-status" role="status" aria-live="polite" hidden></p>
      <div id="account-providers" hidden>
        <div class="account-divider">or continue with</div>
        <div class="account-providers">
          <button type="button" data-provider="google" hidden><span class="provider-google" aria-hidden="true">G</span>Google</button>
          <button type="button" data-provider="microsoft" hidden><span class="provider-microsoft" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Microsoft</button>
        </div>
      </div>
      <a class="account-guest" href="./studio.html">Continue as a guest <span aria-hidden="true">→</span></a>
    </section>
  </main>
  <footer class="account-footer"><span>Cellar Studio</span><nav aria-label="Account policies"><a href="./privacy.html">Privacy</a><a href="./terms.html">Terms</a><a href="./contact.html">Help</a></nav></footer>
</body>
</html>
