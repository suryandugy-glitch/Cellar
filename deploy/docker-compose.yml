# UNTESTED TEMPLATE. Set the domain, provide CELLAR_MASTER_KEY from a secret manager (openssl rand -base64 32), then review.
services:
  cellar:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      CELLAR_PUBLIC_URL: https://cellar.example.com
      CELLAR_MASTER_KEY: ${CELLAR_MASTER_KEY:?provide via secret manager or an uncommitted .env}
    volumes: [ "cellar-data:/data" ]
    read_only: true
    tmpfs: [ "/tmp" ]
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    networks: [ internal ]          # not published to the host; only the proxy can reach it
    restart: unless-stopped
  proxy:
    image: caddy:2
    ports: [ "443:443", "80:80" ]
    volumes: [ "./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data" ]
    networks: [ internal, default ]
    depends_on: [ cellar ]
networks: { internal: { internal: true }, default: {} }
volumes: { cellar-data: {}, caddy-data: {} }
