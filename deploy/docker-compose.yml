services:
  cellar:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      CELLAR_DOMAIN: ${CELLAR_DOMAIN:?set the public hostname}
      CELLAR_PUBLIC_URL: https://${CELLAR_DOMAIN:?set the public hostname}
      CELLAR_ACCESS_KEY: ${CELLAR_ACCESS_KEY:?set a shared access key from your secret manager}
      CELLAR_MASTER_KEY: ${CELLAR_MASTER_KEY:?set the persistent master key from your secret manager}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS --max-time 3 -H "Host: $${CELLAR_DOMAIN}"
          -H 'X-Forwarded-Proto: https' http://127.0.0.1:8080/api/ready
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes: [ "cellar-data:/data" ]
    read_only: true
    tmpfs: [ "/tmp" ]
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    networks: [ internal ]          # not published to the host; only the proxy can reach it
    restart: unless-stopped
    stop_grace_period: 25s
  proxy:
    image: caddy:2
    environment:
      CELLAR_DOMAIN: ${CELLAR_DOMAIN:?set the public hostname}
    ports: [ "443:443", "80:80" ]
    volumes: [ "./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config" ]
    networks: [ internal, default ]
    depends_on:
      cellar:
        condition: service_healthy
    restart: unless-stopped
networks: { internal: { internal: true }, default: {} }
volumes: { cellar-data: {}, caddy-data: {}, caddy-config: {} }
